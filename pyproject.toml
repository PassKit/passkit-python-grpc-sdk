[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "passkit-python-grpc-sdk"
version = "1.1.162"
description = "Python gRPC SDK for the PassKit API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "PassKit", email = "support@passkit.com" },
]
keywords = ["passkit", "grpc", "apple-wallet", "google-wallet", "digital-passes"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "googleapis-common-protos>=1.70.0,<2",
  "grpcio>=1.74.0,<2",
  "protobuf>=6.31.1,<8",
  "protoc-gen-openapiv2>=0.0.1,<0.1",
]

[project.optional-dependencies]
dev = [
  "build>=1.3,<2",
  "twine>=6.2,<7",
]

[project.urls]
Homepage = "https://passkit.com"
Documentation = "https://docs.passkit.io"
Repository = "https://github.com/PassKit/passkit-python-grpc-sdk"
Issues = "https://github.com/PassKit/passkit-python-grpc-sdk/issues"
Changelog = "https://github.com/PassKit/passkit-python-grpc-sdk/blob/main/changelog.md"

[tool.hatch.build.targets.wheel]
# Keep metadata compatible with the Twine 6.x validation tools.
core-metadata-version = "2.4"
packages = ["passkit"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
  "/passkit",
  "/LICENSE",
  "/README.md",
  "/changelog.md",
  "/pyproject.toml",
]
